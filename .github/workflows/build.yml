name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unpack and build every app
        run: |
          for z in *.zip; do unzip -q -o "$z"; done
          mkdir -p out
          for d in */; do
            if [ -f "$d/settings.gradle.kts" ]; then
              (cd "$d" && gradle assembleDebug --no-daemon --stacktrace)
              cp "$d/app/build/outputs/apk/debug/app-debug.apk" "out/${d%/}.apk"
            fi
          done
          ls -la out

      - name: Keep the APKs as a download
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

      - name: Publish the APKs as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: out/*.apk
